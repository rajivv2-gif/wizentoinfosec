<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="wizGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#102A56" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Pill -->
  <rect width="64" height="64" rx="14" fill="#081426" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#2563EB" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Geometric WIZENTO 'W' Monogram with 3 Pillars Integration -->
  <!-- Left Pillar (Secure): Cyan Shield Node -->
  <path d="M14 20 L22 44 L28 32 L22 20 Z" fill="url(#wizGlow)" />
  <!-- Center Vertex (Build): Electric Blue Core -->
  <path d="M28 32 L32 44 L36 32 L32 20 Z" fill="#22D3EE" />
  <!-- Right Pillar (Grow): Upward Vector -->
  <path d="M36 32 L42 44 L50 20 L44 20 Z" fill="url(#wizGlow)" />
  <!-- Apex Connectivity Accent Dot -->
  <circle cx="32" cy="18" r="2.5" fill="#22D3EE" filter="url(#glow)" />
</svg>